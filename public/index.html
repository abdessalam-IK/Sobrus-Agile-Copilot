<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sobrus AI Copilot</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo" aria-hidden="true">S</div>
      <div>
        <div class="brand-name">Sobrus AI Copilot</div>
        <div class="brand-sub" id="brand-sub">—</div>
      </div>
    </div>
    <div class="controls">
      <label class="field">
        <span>Sprint</span>
        <select id="sprint-select"></select>
      </label>
      <label class="field slider">
        <span>Rejouer au jour <b id="day-label">—</b></span>
        <input type="range" id="day-slider" min="1" max="10" value="10" />
      </label>
      <span class="ai-badge" id="ai-badge" title="Couche IA générative">IA —</span>
    </div>
  </header>

  <nav class="flow" id="flow" aria-label="Cycle Agile"></nav>

  <main>
    <section class="hero" id="hero"></section>

    <div class="layers">
      <span class="layer-label">Agile delivery</span>
      <span class="arrow">↓</span>
      <span class="layer-label ai">AI layer</span>
      <span class="arrow">→</span>
      <span class="pipeline">Insights → Risques → Recommandations → Préparation → Apprentissage</span>
    </div>

    <nav class="tabs" id="tabs" role="tablist"></nav>
    <section id="view" class="view" aria-live="polite"></section>
  </main>

  <footer class="footer">
    L’IA ne remplace ni le Scrum Master, ni le Product Owner, ni l’équipe : elle observe, relie les signaux et prépare la discussion.
    <span id="data-note"></span>
  </footer>

  <script type="module" src="/app.js"></script>
</body>
</html>
